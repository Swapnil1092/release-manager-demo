name: Release Manager Demo - Deploy DEV

on:
  workflow_run:
    workflows:
      - Release Manager Demo - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "ACR image tag / Git commit SHA to deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: release-manager-demo-rg
  CONTAINER_APP_NAME: release-manager-dev
  ACR_NAME: rmreleasedemoacr
  IMAGE_NAME: release-manager-demo

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select image tag
        id: image
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="$MANUAL_IMAGE_TAG"
            echo "Deployment type: MANUAL / ROLLBACK"
          else
            IMAGE_TAG="$WORKFLOW_RUN_SHA"
            echo "Deployment type: AUTOMATIC"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Selected image:"
          echo "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify image exists in ACR
        run: |
          echo "Checking image in ACR..."

          az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --output none

          echo "Image exists in ACR."

      - name: Deploy image to DEV
        run: |
          echo "Deploying image:"
          echo "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

      - name: Get DEV URL
        run: |
          APP_URL=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          echo "APP_URL=https://$APP_URL" >> "$GITHUB_ENV"

      - name: Smoke test DEV
        run: |
          echo "Testing: $APP_URL/health"

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)

            echo "Attempt $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "DEV smoke test passed."
              exit 0
            fi

            sleep 10
          done

          echo "DEV smoke test failed."
          exit 1
